<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Admin Mita Maubel</title>
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar" id="admin-sidebar">
    <div class="sidebar__brand">
      <img src="../images/logo.png" alt="Logo">
      <div><strong>Mita Maubel</strong><small>Panel Admin</small></div>
    </div>
    <nav class="sidebar__nav" id="admin-sidebar-nav"></nav>
    <div class="sidebar__foot">
      <a href="#" id="admin-logout">&#10148; Keluar</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar-admin">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="sidebar-toggle" id="sidebar-toggle">&#9776;</button>
        <div>
          <h1 id="admin-page-title">Dashboard</h1>
          <div class="muted" id="admin-page-sub">Ringkasan usaha Mita Maubel</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <a href="../index.html" class="view-site-btn" target="_blank" rel="noopener">Lihat Situs</a>
        <div class="admin-user">
          <div class="avatar">A</div>
          <span>Admin</span>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-card__top"><div class="stat-card__icon oak">&#128737;</div></div>
          <b id="stat-total-produk">0</b>
          <span>Total Produk</span>
        </div>
        <div class="stat-card">
          <div class="stat-card__top"><div class="stat-card__icon sage">&#10003;</div></div>
          <b id="stat-tersedia">0</b>
          <span>Produk Tersedia</span>
        </div>
        <div class="stat-card">
          <div class="stat-card__top"><div class="stat-card__icon brick">&#10005;</div></div>
          <b id="stat-habis">0</b>
          <span>Stok Habis</span>
        </div>
        <div class="stat-card">
          <div class="stat-card__top"><div class="stat-card__icon amber">&#128172;</div></div>
          <b id="stat-pesanan-baru">0</b>
          <span>Pesanan Custom Baru</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head">
          <h3>Pesanan Custom Terbaru</h3>
          <a href="pesanan.html" class="btn btn--outline btn--sm">Lihat Semua</a>
        </div>
        <div class="panel__body table-wrap">
          <table class="data-table">
            <thead><tr><th>Tanggal</th><th>Nama</th><th>Jenis</th><th>Status</th></tr></thead>
            <tbody id="dashboard-recent-orders"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head">
          <h3>Produk Unggulan</h3>
          <a href="produk.html" class="btn btn--outline btn--sm">Kelola Produk</a>
        </div>
        <div class="panel__body table-wrap">
          <table class="data-table">
            <thead><tr><th></th><th>Nama</th><th>Harga</th><th>Status</th></tr></thead>
            <tbody id="dashboard-produk-list"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="js/admin.js"></script>
<script>
  mmGuard();
  mmRenderAdminShell('dashboard', 'Dashboard', 'Ringkasan usaha Mita Maubel');
  mmInitDashboard();
</script>
</body>
</html>
