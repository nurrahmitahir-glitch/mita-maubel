<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info Usaha — Admin Mita Maubel</title>
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar" id="admin-sidebar">
    <div class="sidebar__brand">
      <img src="../images/logo.png" alt="Logo">
      <div><strong>Mita Maubel</strong><small>Panel Admin</small></div>
    </div>
    <nav class="sidebar__nav" id="admin-sidebar-nav"></nav>
    <div class="sidebar__foot">
      <a href="#" id="admin-logout">&#10148; Keluar</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar-admin">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="sidebar-toggle" id="sidebar-toggle">&#9776;</button>
        <div>
          <h1 id="admin-page-title">Info Usaha</h1>
          <div class="muted" id="admin-page-sub">Kelola informasi yang tampil di situs publik</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <a href="../index.html" class="view-site-btn" target="_blank" rel="noopener">Lihat Situs</a>
        <div class="admin-user"><div class="avatar">A</div><span>Admin</span></div>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        <div class="panel__head"><h3>Profil & Kontak Usaha</h3></div>
        <div class="panel__body">
          <form id="pengaturan-form">
            <div class="form-grid">
              <div class="field full">
                <label for="p-nama">Nama Usaha</label>
                <input type="text" id="p-nama" name="nama">
              </div>
              <div class="field full">
                <label for="p-tagline">Tagline</label>
                <input type="text" id="p-tagline" name="tagline">
              </div>
              <div class="field full">
                <label for="p-alamat">Alamat Toko / Workshop</label>
                <textarea id="p-alamat" name="alamat"></textarea>
              </div>
              <div class="field">
                <label for="p-whatsapp">Nomor WhatsApp (format 62xxxx)</label>
                <input type="text" id="p-whatsapp" name="whatsapp" placeholder="6285398830913">
                <span class="hint">Dipakai untuk tombol chat &amp; link wa.me di seluruh situs.</span>
              </div>
              <div class="field">
                <label for="p-whatsappDisplay">Nomor WhatsApp (tampilan)</label>
                <input type="text" id="p-whatsappDisplay" name="whatsappDisplay" placeholder="0853-9883-0913">
              </div>
              <div class="field">
                <label for="p-jamBuka">Jam Buka</label>
                <input type="text" id="p-jamBuka" name="jamBuka" placeholder="08.00">
              </div>
              <div class="field">
                <label for="p-jamTutup">Jam Tutup</label>
                <input type="text" id="p-jamTutup" name="jamTutup" placeholder="22.00">
              </div>
              <div class="field full">
                <label for="p-hariOperasional">Hari Operasional</label>
                <input type="text" id="p-hariOperasional" name="hariOperasional" placeholder="Setiap hari">
              </div>
              <div class="field full">
                <label for="p-pembayaran">Sistem Pembayaran</label>
                <input type="text" id="p-pembayaran" name="pembayaran" placeholder="Transfer Bank atau Tunai (Cash)">
              </div>
              <div class="field full">
                <label for="p-pengiriman">Sistem Pengiriman</label>
                <input type="text" id="p-pengiriman" name="pengiriman" placeholder="Melayani dalam kota & luar daerah">
              </div>
              <div class="field full">
                <label for="p-deskripsi">Deskripsi Usaha</label>
                <textarea id="p-deskripsi" name="deskripsi"></textarea>
              </div>
              <div class="field">
                <label for="p-instagram">Instagram (opsional)</label>
                <input type="text" id="p-instagram" name="instagram" placeholder="@mitamaubel">
              </div>
              <div class="field">
                <label for="p-facebook">Facebook (opsional)</label>
                <input type="text" id="p-facebook" name="facebook" placeholder="Mita Maubel">
              </div>
              <div class="field full">
                <label for="p-mapsQuery">Lokasi untuk Google Maps</label>
                <input type="text" id="p-mapsQuery" name="mapsQuery" placeholder="Coppo, Kecamatan Barru, Kabupaten Barru">
                <span class="hint">Dipakai untuk menampilkan peta pada halaman Hubungi Kami.</span>
              </div>
            </div>
            <div style="margin-top:24px;">
              <button type="submit" class="btn btn--primary">Simpan Perubahan</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="js/admin.js"></script>
<script>
  mmGuard();
  mmRenderAdminShell('pengaturan', 'Info Usaha', 'Kelola informasi yang tampil di situs publik');
  mmInitPengaturanPage();
</script>
</body>
</html>
