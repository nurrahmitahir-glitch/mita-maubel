<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — Mita Maubel</title>
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark">
      <img src="../images/logo.png" alt="Logo Mita Maubel">
      <span>Mita Maubel</span>
      <small>Panel Admin</small>
    </div>

    <div class="login-error" id="login-error">Username atau password salah. Silakan coba lagi.</div>

    <form id="login-form">
      <div class="login-field">
        <label for="user">Username</label>
        <input type="text" id="user" name="user" required autocomplete="username" placeholder="admin">
      </div>
      <div class="login-field">
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn--primary btn--block">Masuk</button>
    </form>

    <div class="login-hint">
      Demo login &mdash; Username: <code>admin</code> &middot; Password: <code>mitamaubel123</code><br>
      <a href="../index.html">&larr; Kembali ke situs</a>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="js/admin.js"></script>
<script>
  if(mmIsLoggedIn()){ window.location.href = 'dashboard.html'; }

  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    const user = document.getElementById('user').value.trim();
    const pass = document.getElementById('pass').value;
    const errBox = document.getElementById('login-error');
    if(mmLogin(user, pass)){
      window.location.href = 'dashboard.html';
    } else {
      errBox.classList.add('show');
    }
  });
</script>
</body>
</html>
